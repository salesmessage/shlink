# How to run it: "Test stack" in README.md next to this file.
# The fork runs only the unit suite (AGENTS.md), so the stack has no database or other services.
name: shlink-testing

services:
  tests:
    image: sm-testing-php:8.3-9797f222f244
    build:
      context: .
      dockerfile: php-cli.Dockerfile
      args:
        VER: "8.3"
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      # composer stops a script after 300 seconds by default
      COMPOSER_PROCESS_TIMEOUT: "0"
      APP_ENV: test
      COMPOSER_AUTH:
      NODE_AUTH_TOKEN:
    entrypoint:
      - sh
      - -ec
      - |
        # an auth.json next to composer.json wins: COMPOSER_AUTH would override it
        if [ -z "$${COMPOSER_AUTH:-}" ] && [ -n "$${NODE_AUTH_TOKEN:-}" ] && [ ! -f auth.json ]; then
          export COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$${NODE_AUTH_TOKEN}\"}}"
        fi
        # the same install options as the CI job (.github/workflows/ci.yml)
        [ -f vendor/autoload.php ] || composer install --no-interaction --no-progress --prefer-dist \
          --no-scripts --no-plugins --ignore-platform-req=php --ignore-platform-req=ext-rdkafka
        exec "$$@"
      - tests
    command: composer test:unit
