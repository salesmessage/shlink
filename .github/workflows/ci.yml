name: CI (quality check)

on:
  push:
    branches:
      - develop
      - release
      - hotfix
      - midsprint
  pull_request:
    branches:
      - develop
      - release
      - hotfix
      - midsprint
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  main:
    name: Tests and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    # The database of the DB and API suites; config/test/test_config.global.php reads it at 127.0.0.1:5434 when CI is set
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: shlink_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      LC_ALL: C

    steps:
      - name: Refuse pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::CI does not build pull requests from forks"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          # The extensions of the production image (Dockerfile), except rdkafka: no test talks to Kafka
          extensions: bcmath, calendar, curl, intl, mbstring, pdo, pdo_pgsql, pdo_sqlite, sockets, zip
          coverage: none

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -z "$COMPOSER_AUTH" ]; then
            echo "::error::the COMPOSER_AUTH repository secret is not set"
            exit 1
          fi

          COMPOSER_AUTH="$(jq -nc '{"github-oauth":{"github.com":env.COMPOSER_AUTH}}')"
          export COMPOSER_AUTH

          composer install \
            --no-interaction \
            --no-progress \
            --no-ansi \
            --prefer-dist \
            --no-scripts \
            --no-plugins \
            --ignore-platform-req=ext-rdkafka

      - name: Download the RoadRunner binary
        env:
          # rr get reads it to avoid the GitHub API rate limit of anonymous calls
          GITHUB_TOKEN: ${{ github.token }}
        run: ./vendor/bin/rr get --no-interaction --no-config --location bin/ && chmod +x bin/rr

      - name: Lint and format
        run: composer cs

      - name: Analysis
        if: '!cancelled()'
        run: composer analyze

      - name: OpenAPI spec
        if: '!cancelled()'
        run: composer openapi:validate

      - name: Unit tests
        if: '!cancelled()'
        run: composer test:unit

      - name: Database tests (Postgres)
        if: '!cancelled()'
        run: composer test:db:postgres

      - name: API tests (Postgres)
        if: '!cancelled()'
        run: composer test:api
