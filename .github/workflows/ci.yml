name: CI (quality check)

on:
  push:
    branches:
      - develop
      - release
      - hotfix
      - midsprint
  pull_request:
    branches:
      - develop
      - release
      - hotfix
      - midsprint
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  main:
    name: Tests and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Refuse pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::CI does not build pull requests from forks"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          # Mirrors sm-php-cli:8.3, the image ./indocker_test runs the same suite in
          extensions: curl, gd, mbstring, pdo, pdo_pgsql, pdo_sqlite, redis, sockets, sodium, zip
          coverage: none

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -z "$COMPOSER_AUTH" ]; then
            echo "::error::the COMPOSER_AUTH repository secret is not set"
            exit 1
          fi

          COMPOSER_AUTH="$(jq -nc '{"github-oauth":{"github.com":env.COMPOSER_AUTH}}')"
          export COMPOSER_AUTH

          composer install \
            --no-interaction \
            --no-progress \
            --no-ansi \
            --prefer-dist \
            --no-scripts \
            --no-plugins \
            --ignore-platform-req=php \
            --ignore-platform-req=ext-rdkafka

      - name: Analysis
        run: composer stan

      - name: Run tests
        if: '!cancelled()'
        run: composer test:unit
