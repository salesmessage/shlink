name: Mutation tests

on:
  workflow_call: null

jobs:
  mutation-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        php-version: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v3
      - uses: './.github/actions/ci-setup'
        with:
          php-version: ${{ matrix.php-version }}
          php-extensions: openswoole-4.12.0, rdkafka
          extensions-cache-key: mutation-tests-extensions-${{ matrix.php-version }}-unit
      - uses: actions/download-artifact@v3
        with:
          name: coverage-unit
          path: build
      - name: Resolve infection args
        id: infection_args
        run: echo "::set-output name=args::--logger-github=false"
        shell: bash
      - run: composer infect:ci:unit -- ${{ steps.infection_args.outputs.args }}
        env:
          INFECTION_BADGE_API_KEY: ${{ secrets.INFECTION_BADGE_API_KEY }}
